name: CI - Lint, Jest & Cypress

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: 🧪 Full CI (Lint, Jest, Cypress)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: skillwise_test_db
          POSTGRES_USER: skillwise_user
          POSTGRES_PASSWORD: skillwise_pass
        ports: ['5444:5432']
        options: >-
          --health-cmd="pg_isready -U skillwise_user -d skillwise_test_db -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      # -------------------------
      # 1️⃣ Checkout repository
      # -------------------------
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # 2️⃣ Setup Node.js
      # -------------------------
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # -------------------------
      # 3️⃣ Install root dependencies (lint configs, Cypress, etc.)
      # -------------------------
      - name: 📥 Install root dependencies
        run: npm ci

      # -------------------------
      # 4️⃣ Install backend dependencies
      # -------------------------
      - name: 📥 Install backend dependencies
        run: cd backend && npm ci

      # -------------------------
      # 5️⃣ Lint codebase (ignore Cypress warnings)
      # -------------------------
      - name: 🔍 Run ESLint
        run: npm run lint || echo "⚠️ Lint warnings ignored for CI"

      # -------------------------
      # 6️⃣ Wait for Postgres to be ready
      # -------------------------
      - name: 🕓 Wait for Postgres to be ready
        run: |
          echo "⏳ Waiting for Postgres..."
          for i in {1..15}; do
            if pg_isready -h localhost -p 5444 -U skillwise_user -d skillwise_test_db; then
              echo "✅ Postgres is ready!"
              break
            fi
            echo "Retrying in 3s..."
            sleep 3
          done

      # -------------------------
      # 7️⃣ Run backend migrations
      # -------------------------
      - name: 🗂️ Run backend migrations
        run: |
          cd backend
          node scripts/migrate.js || (echo "❌ Migrations failed" && exit 1)
        env:
          DATABASE_URL: postgresql://skillwise_user:skillwise_pass@localhost:5444/skillwise_test_db

      # -------------------------
      # 8️⃣ Run backend tests (Jest)
      # -------------------------
      - name: 🧪 Run Backend Integration Tests
        run: cd backend && npm run test:integration -- --ci --runInBand
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://skillwise_user:skillwise_pass@localhost:5444/skillwise_test_db

      # -------------------------
      # 9️⃣ Install frontend dependencies
      # -------------------------
      - name: 📥 Install frontend dependencies
        run: cd frontend && npm ci

      # -------------------------
      # 🔟 Run frontend lint
      # -------------------------
      - name: 🔍 Run Frontend Linter
        run: cd frontend && npm run lint || echo "⚠️ Lint warnings ignored for CI"

      # -------------------------
      # 11️⃣ Run frontend unit tests
      # -------------------------
      - name: 🧩 Run Frontend Unit Tests
        run: cd frontend && npm test -- --watchAll=false || echo "No unit tests"

      # -------------------------
      # 12️⃣ Start backend and frontend for Cypress
      # -------------------------
      - name: 🚀 Start backend and frontend servers
        run: |
          cd backend && npm start &
          cd frontend && npm start &
          sleep 20
          echo "✅ Both backend and frontend are running"

      # -------------------------
      # 13️⃣ Run Cypress E2E tests
      # -------------------------
      - name: 🌐 Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: 'http://localhost:3000,http://localhost:3001/api'
          wait-on-timeout: 90
          browser: chrome
