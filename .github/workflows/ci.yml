name: CI — lint, tests, Cypress

on:
  pull_request:
    branches: [main, '**']

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: skillwise_user
          POSTGRES_PASSWORD: skillwise_pass
          POSTGRES_DB: skillwise_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillwise_user -d skillwise_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Point the app and tests to the Postgres service
      TEST_DATABASE_URL: postgresql://skillwise_user:skillwise_pass@localhost:5432/skillwise_test_db
      DATABASE_URL: postgresql://skillwise_user:skillwise_pass@localhost:5432/skillwise_test_db
      # Ensure Node uses CI mode where tests are non-interactive
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install root dev dependencies (for lint)
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run repository-level lint (ignore Cypress specs)
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --ignore-pattern 'frontend/cypress/**' || true

      - name: Wait for Postgres to be ready
        run: |
          echo "Waiting for Postgres..."
          retry=0
          until pg_isready -h localhost -p 5432 -U skillwise_user || [ $retry -ge 15 ]; do
            retry=$((retry+1))
            sleep 1
          done

      - name: Run backend migrations
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: node scripts/migrate.js || true

      - name: Run backend tests (Jest)
        working-directory: ./backend
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm test --silent

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint || true

      - name: Run frontend unit tests
        working-directory: ./frontend
        env:
          CI: true
        # Allow CI to pass even when there are no frontend tests yet
        run: npm test -- --watchAll=false --silent --passWithNoTests

      - name: Start backend server (background)
        run: |
          nohup node backend/server.js > backend.log 2>&1 &

      - name: Start frontend dev server (background)
        working-directory: ./frontend
        run: |
          nohup npm start > frontend.log 2>&1 &

      - name: Wait for frontend and backend to be ready
        run: |
          npx wait-on http://localhost:3000 || (cat frontend/frontend.log || true)
          npx wait-on http://localhost:3001/api || (cat backend/backend.log || true)

      - name: Run Cypress tests
        working-directory: ./frontend
        run: npx cypress run --spec "cypress/e2e/**/*.cy.{js,jsx,ts,tsx}"
